<a class="list--item -tag list-group-item" href="#{{ uri }}notes/f/tag/q/{{name}}" data-id="{{id}}">
    <i class="icon-tag"></i>
    {=cleanXSS(name)}
    <% if (count) { %><span class="pull-right badge">{{count}}</span><% } %>
</a>

<div class="list--buttons btn-group dropdown">
    <button class="drop-edit btn dropdown-toggle" data-toggle="dropdown" title="{{ i18n('Edit') }}">
        <i class="icon-dots"></i>
    </button>
    <ul class="dropdown-menu pull-right" role="menu" aria-labelledby="dropdownMenu{{id}}">
        <li><a class="edit-link" href="#{{ uri }}tags/edit/{{id}}">{{ i18n('Edit') }}</a></li>
        <li><a class="remove-link" href="#">{{ i18n('Remove') }}</a></li>
    </ul>
</div>
