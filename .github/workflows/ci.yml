# Phase 1 CI gate for Seshat: install, build, smoke.
# Green means: deps install on Node 22, lint passes, gulp build
# succeeds, and the built app serves with its entry assets.
name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm dependencies
        run: npm ci

      - name: "bower dependencies (deprecated but working)"
        run: npx --yes bower install

      - name: lint
        run: npx gulp test

      - name: gulp build
        run: npx gulp build

      - name: smoke test
        run: |
          (cd dist && python3 -m http.server 8901 &>/dev/null &)
          sleep 2
          curl -sf http://localhost:8901/index.html | grep -q "data-main='scripts/main'"
          curl -sf -o /dev/null http://localhost:8901/scripts/main.js
          curl -sf -o /dev/null http://localhost:8901/app.appcache
          curl -sf -o /dev/null http://localhost:8901/locales/locales.json
          test -f dist/app.appcache
