# CI gate for Seshat.
# build: deps install on Node 22, lint passes, gulp build succeeds,
# the built app serves with its entry assets, unit and browser tests.
# shell: the desktop shell compiles and its own tests pass.
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    # Pinned: ubuntu-latest moved to 26.04, whose apt layout breaks
    # `playwright install --with-deps` on @playwright/test 1.x.
    # Revisit on the next Playwright major bump.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm dependencies
        run: npm ci

      - name: lint
        run: npx gulp test

      - name: gulp build
        run: npx gulp build

      - name: smoke test
        run: |
          (cd dist && python3 -m http.server 8901 &>/dev/null &)
          sleep 2
          curl -sf http://localhost:8901/index.html | grep -q "data-main='scripts/main'"
          curl -sf -o /dev/null http://localhost:8901/scripts/main.js
          curl -sf -o /dev/null http://localhost:8901/app.appcache
          curl -sf -o /dev/null http://localhost:8901/locales/locales.json
          test -f dist/app.appcache

      - name: unit tests
        run: npx vitest run

      - name: e2e tests
        # No --with-deps: headless shell needs no apt packages, and the
        # runners' archive mirror keeps flaking on DNS.
        run: |
          npx playwright install chromium
          npm run test:e2e

  shell:
    # The desktop shell's own tests: what the page may ask rsync to
    # do (src-tauri/src/sync.rs), run against the real rsync.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 30
          done
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rsync openssh-client

      # The shell embeds the built app, so it has to exist to compile
      - name: npm dependencies
        run: npm ci

      - name: gulp build
        run: npx gulp build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
