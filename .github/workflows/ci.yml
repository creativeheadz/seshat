# Phase 0 CI skeleton for Seshat (GitHub Actions; Gitea deferred).
#
# EXPECTED RED: this workflow runs the real install/build/smoke commands
# against the unrestored tree so the failure is on record. Phase 1
# (build resuscitation) is what turns it green. Do not "fix" this file
# by weakening steps into echo placeholders.
name: ci-skeleton

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm dependencies
        run: npm install

      - name: "bower dependencies (known dead: 4 git:// deps)"
        run: npx --yes bower install

      - name: "gulp build (known dead: Gulp 3 on Node 12+)"
        run: npx --yes gulp build

      - name: smoke placeholder (runs once build passes)
        run: 'echo "TODO phase 1 - serve built app, assert index loads"'
