# Seshat desktop builds (Linux; macOS/Windows stay workstation-driven).
# Runs on release tags (attaches the .deb to the release) and manually.
#
# Manual runs: leave `tag` empty for a dry run of the chosen branch,
# or name an existing release tag to build that tag's source and
# attach the .deb to its release (how a failed tag run is repaired
# without moving the tag).
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (empty: dry run)'
        required: false
        default: ''

# Attaching to a release needs write access to contents; the default
# token is read-only, which failed the v0.8.0-rc2 upload with a 403.
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 30
          done
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm dependencies
        run: npm ci

      - name: tauri build
        run: npx --yes @tauri-apps/cli@2.12.4 build

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: >
          gh release upload "$TAG"
          src-tauri/target/release/bundle/deb/*.deb
          --clobber --repo ${{ github.repository }}
