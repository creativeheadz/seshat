# Seshat desktop builds (Linux; macOS/Windows stay workstation-driven).
# Runs on release tags (attaches the .deb to the release) and manually.
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: system dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 30
          done
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm dependencies
        run: npm ci

      - name: tauri build
        run: npx tauri build

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ github.ref_name }}
          src-tauri/target/release/bundle/deb/*.deb
          --clobber --repo ${{ github.repository }}
